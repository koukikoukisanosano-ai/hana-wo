# ハナハナ予想システム（オーギヤWO）クラウド版 設定ファイル
# iPhoneのGitHubアプリやSafariからこのファイルを編集すると、次回の実行から反映されます。

storage: csv               # データをCSVでリポジトリに保存（クラウド実行用。変更しないでください）

hall:
  name: オーギヤWO
  anaslo_list_url: https://ana-slo.com/ホールデータ/愛知県/オーギヤwo-データ一覧/
  anaslo_day_url: https://ana-slo.com/{date}-%e3%82%aa%e3%83%bc%e3%82%ae%e3%83%a4wo-data/
  minrepo_tag_url: https://min-repo.com/tag/wo/
  event_digits: [0, 5]     # 旧イベント日（日付の末尾）

target:
  keyword: ハナハナ         # 機種名にこの文字を含む台が対象
  high_min: 5               # 「高設定」とみなす設定（5なら設定5・6）
  reg_weight: 1.5           # 設定判定でREGをBIGより何倍重く見るか（REGは設定差が大きい）
  judge_min_games: 2000     # これ未満のG数の日は設定を判定しない
  # 島の区切り（角台の判定用）。例: islands: [[668, 677], [678, 687], [693, 703]]
  islands: []

phone:
  pages_per_run: 1          # iPhoneが1回に取りに行くページ数（自動実行では2ページ目で止まりやすいので1）

fetch:
  anaslo_direct: false      # クラウドから直接アナスロへ取りに行くか（GitHubからは拒否されるので false）
  interval_sec: 75          # アナスロ 1ページごとの待ち時間（秒）
  jitter_sec: 30
  backoff_min: 20           # アクセス制限(403)が出たときに休む時間（分）
  daily_max_pages: 8
  minrepo_interval_sec: 8
  engine: auto              # auto / requests / playwright

predict:
  top_n: 10
  prev_max_gap: 1
  open_browser: false
