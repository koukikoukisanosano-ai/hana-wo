name: ハナハナ予想

on:
  schedule:
    - cron: '41 22 * * *'                    # 毎朝 7:41（日本時間）: 新しいデータを取得して今日の予想
    - cron: '11 1,4,7,10,13,16,19 * * *'     # 3時間おき: 過去データの取得を進めて予想を更新
  workflow_dispatch:                         # iPhoneから手動で実行するとき
    inputs:
      mode:
        description: 'daily=取得して予想 / backfill=過去データ取得 / predict=予想だけ作り直す'
        type: choice
        options: [daily, backfill, predict]
        default: daily
  push:
    branches: [main]
    paths: ['hana/**', 'config.yaml', 'requirements.txt', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hana
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 準備
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 取得と予想
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "41 22 * * *" ] || [ "${{ github.event_name }}" = "push" ]; then
              MODE=daily
            else
              MODE=backfill
            fi
          fi
          echo "実行モード: $MODE"
          case "$MODE" in
            daily)    python -m hana daily ;;
            backfill) python -m hana backfill --max-minutes 45 ;;
            predict)  python -m hana predict ;;
          esac
          python -m hana status

      - name: データを保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "データ更新 $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase -X theirs && git push -q && break
            sleep 5
          done

      - name: ログを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log
          path: logs/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
